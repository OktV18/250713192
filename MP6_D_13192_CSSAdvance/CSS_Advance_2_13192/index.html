<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Kegiatan</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>

    <div class="form-container">
        <h1>Formulir Pendaftaran Kegiatan</h1>
        <p class="desc">Silakan isi data diri dan pilihan kegiatan Anda di bawah ini.</p>

        <form action="" method="post" enctype="multipart/form-data">
            
            <!-- Tabel 1: Data Pendaftar -->
            <table>
                <tr>
                    <td colspan="2" class="section-header"><strong>Data Pendaftar</strong></td>
                </tr>
                <tr>
                    <td class="label-cell">
                        <label for="nama"><strong>Nama Lengkap</strong></label>
                    </td>
                    <td>
                        <input type="text" id="nama" name="nama" size="30" />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="nim"><strong>Nomor Induk Mahasiswa (NIM)</strong></label>
                    </td>
                    <td>
                        <input type="text" id="nim" name="nim" size="30" />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="prodi"><strong>Program Studi</strong></label>
                    </td>
                    <td>
                        <select id="prodi" name="prodi">
                            <option value="Informatika">Informatika</option>
                            <option value="Sistem Informasi">Sistem Informasi</option>
                            <option value="Teknik Industri">Teknik Industri</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>
                        <strong>Jenis Kelamin</strong>
                    </td>
                    <td>
                        <input type="radio" id="laki" name="jk" value="Laki-laki" />
                        <label for="laki">Laki-laki</label>
                        <input type="radio" id="perempuan" name="jk" value="Perempuan" />
                        <label for="perempuan">Perempuan</label>
                    </td>
                </tr>
            </table>

            <br />

            <!-- Tabel 2: Pilihan Kegiatan -->
            <table>
                <tr>
                    <td colspan="2" class="section-header"><strong>Pilihan Kegiatan</strong></td>
                </tr>
                <tr>
                    <td class="label-cell">
                        <strong>Jenis Kegiatan</strong>
                    </td>
                    <td>
                        <input type="radio" id="seminar" name="kegiatan" value="Seminar" />
                        <label for="seminar">Seminar</label>
                        <input type="radio" id="pelatihan" name="kegiatan" value="Pelatihan" />
                        <label for="pelatihan">Pelatihan</label>
                        <input type="radio" id="diskusi" name="kegiatan" value="Diskusi" />
                        <label for="diskusi">Diskusi</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <strong>Bidang Minat</strong>
                    </td>
                    <td>
                        <input type="checkbox" id="teknologi" name="minat" value="Teknologi" />
                        <label for="teknologi">Teknologi</label>
                        <br />
                        <input type="checkbox" id="organisasi" name="minat" value="Organisasi" />
                        <label for="organisasi">Organisasi</label>
                        <br />
                        <input type="checkbox" id="karier" name="minat" value="Karier" />
                        <label for="karier">Karier</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="waktu"><strong>Waktu Kegiatan</strong></label>
                    </td>
                    <td>
                        <select id="waktu" name="waktu">
                            <option value="Pagi">Pagi</option>
                            <option value="Siang">Siang</option>
                            <option value="Sore">Sore</option>
                        </select>
                    </td>
                </tr>
            </table>

            <br />

            <!-- Tabel 3: Kelengkapan Pendaftaran -->
            <table>
                <tr>
                    <td colspan="2" class="section-header"><strong>Kelengkapan Pendaftaran</strong></td>
                </tr>
                <tr>
                    <td class="label-cell" style="vertical-align:top;">
                        <label for="harapan"><strong>Harapan Mengikuti Kegiatan</strong></label>
                    </td>
                    <td>
                        <textarea id="harapan" name="harapan" rows="5" cols="30"></textarea>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="bukti"><strong>Bukti Pembayaran</strong></label>
                    </td>
                    <td>
                        <input type="file" id="bukti" name="bukti" accept="image/jpeg, image/png, application/pdf" />
                    </td>
                </tr>
                <tr>
                    <td colspan="2" class="submit-center">
                        <input type="submit" name="kirim" value="Kirim Data" class="btn" />
                    </td>
                </tr>
            </table>

        </form>
    </div>

</body>
</html>
